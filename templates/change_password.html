{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Your Password{% endblock %}
{% block content %}
<div class="card" style="max-width:520px; margin:0 auto;">
    <h3 class="card-header"><i class="bi bi-key-fill"></i> Change Password</h3>
    <form method="POST">
        <div class="form-group"><label>Current Password</label><input type="password" name="current_password" required></div>
        <div class="form-group"><label>New Password</label><input type="password" name="new_password" required minlength="6"></div>
        <div class="form-group"><label>Confirm New Password</label><input type="password" name="confirm_password" required minlength="6"></div>
        <div class="flex gap-10 mt-20">
            <button type="submit" class="btn btn-success w-100"><i class="bi bi-check-circle"></i> Update Password</button>
            <a href="javascript:history.back()" class="btn btn-navy w-100"><i class="bi bi-x-circle"></i> Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
