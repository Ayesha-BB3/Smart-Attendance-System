{% extends "base.html" %}
{% block title %}Edit Student{% endblock %}
{% block page_title %}Edit Student{% endblock %}
{% block content %}
<div class="card" style="max-width:520px; margin:0 auto;">
    <h3 class="card-header"><i class="bi bi-pencil-square"></i> Edit Student Details</h3>
    <form method="POST">
        <div class="form-group"><label>Student Name</label><input type="text" name="name" value="{{ student[0] }}" required></div>
        <div class="form-group"><label>Roll Number</label><input type="text" name="roll_number" value="{{ student[1] }}" required></div>
        <div class="form-group"><label>New Password <span class="text-muted">(leave empty to keep current)</span></label><input type="password" name="password" placeholder="New password (optional)"></div>
        <div class="flex gap-10 mt-20">
            <button type="submit" class="btn btn-success w-100"><i class="bi bi-check-circle"></i> Save Changes</button>
            <a href="javascript:history.back()" class="btn btn-navy w-100"><i class="bi bi-x-circle"></i> Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
