<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Attendance System - FYP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="page-landing">

    <div class="landing-container">
        <!-- Top Navigation -->
        <nav class="top-navbar">
            <a href="/" class="nav-logo">
                <div class="nav-logo-icon">
                    <i class="bi bi-person-bounding-box"></i>
                </div>
                FacialID Attendance
            </a>
            <a href="/register" class="btn-register-top">
                <i class="bi bi-person-plus"></i> Create Account
            </a>
        </nav>

        <!-- Hero Title -->
        <div class="hero-section">
            <h1 class="hero-title">Smart Attendance System<br>using Face Recognition</h1>
            <p class="hero-subtitle">Automated Facial Recognition Portal</p>
        </div>

        <!-- Portal Cards -->
        <div class="portal-grid">
            
            <!-- Student Card -->
            <div class="portal-card">
                <div class="portal-header">
                    <div class="portal-icon-left"><i class="bi bi-mortarboard-fill"></i></div>
                    <i class="bi bi-person-bounding-box portal-icon-right"></i>
                </div>
                <div class="portal-title">Student Portal</div>
                <div class="portal-desc">Access your attendance records & profile</div>
                <a href="/login/student" class="btn-portal">Login <i class="bi bi-arrow-right"></i></a>
            </div>

            <!-- Teacher Card -->
            <div class="portal-card">
                <div class="portal-header">
                    <div class="portal-icon-left"><i class="bi bi-easel-fill"></i></div>
                    <i class="bi bi-camera-video portal-icon-right"></i>
                </div>
                <div class="portal-title">Teacher Portal</div>
                <div class="portal-desc">Manage class attendance & schedules</div>
                <a href="/login/teacher" class="btn-portal">Login <i class="bi bi-arrow-right"></i></a>
            </div>

            <!-- HOD Card -->
            <div class="portal-card">
                <div class="portal-header">
                    <div class="portal-icon-left"><i class="bi bi-shield-fill"></i></div>
                    <i class="bi bi-bar-chart-fill portal-icon-right"></i>
                </div>
                <div class="portal-title">HOD Portal</div>
                <div class="portal-desc">Oversee department analytics & reports</div>
                <a href="/login/hod" class="btn-portal">Login <i class="bi bi-arrow-right"></i></a>
            </div>

        </div>
    </div>

</body>
</html>
