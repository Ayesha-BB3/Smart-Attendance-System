{% extends "base.html" %}
{% block title %}HOD Settings{% endblock %}
{% block page_title %}HOD Settings — Secret Code{% endblock %}
{% block content %}
<div class="card" style="max-width:520px; margin:0 auto; border-left:5px solid var(--accent);">
    <h3 class="card-header"><i class="bi bi-shield-lock-fill"></i> Change Admin Secret Code</h3>
    <p class="text-muted" style="font-size:0.9rem; margin-bottom:20px;">
        This secret code is only used for registering new HODs. Teachers and Students do not need it.
    </p>
    <form method="POST">
        <div class="form-group"><label>Current Secret Code</label><input type="password" name="current_code" required></div>
        <div class="form-group"><label>New Secret Code</label><input type="password" name="new_code" required minlength="3"></div>
        <div class="form-group"><label>Confirm New Secret Code</label><input type="password" name="confirm_code" required minlength="3"></div>
        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-circle"></i> Update Secret Code</button>
    </form>
</div>
{% endblock %}
