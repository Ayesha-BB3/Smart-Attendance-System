{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block page_title %}My Profile{% endblock %}
{% block content %}
<div class="card" style="max-width:520px; margin:0 auto; border-top:4px solid var(--navy);">
    <h3 class="card-header"><i class="bi bi-person-badge"></i> Edit Profile</h3>
    
    <!-- enctype zaroori hai file upload ke liye -->
    <form method="POST" enctype="multipart/form-data">
        
        <!-- Profile Picture Section -->
        <div class="text-center mb-20">
            {% if user_info[3] %}
                <img src="/student_image/{{ user_info[3] }}" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--mint); box-shadow: var(--shadow-sm);">
            {% else %}
                <div class="flex-center" style="width: 120px; height: 120px; background: var(--bg-main); border-radius: 50%; margin: 0 auto; border: 4px dashed var(--border);">
                    <i class="bi bi-person" style="font-size: 4rem; color: var(--text-secondary);"></i>
                </div>
            {% endif %}
            
            <div class="mt-15">
                <label for="profile_pic" class="btn btn-light" style="cursor: pointer; display: inline-block;">
                    <i class="bi bi-camera"></i> Upload New Picture
                </label>
                <input type="file" name="profile_pic" id="profile_pic" accept="image/*" style="display: none;" onchange="document.getElementById('file-name').innerText = this.files[0].name">
                <div id="file-name" class="text-muted mt-5" style="font-size:0.8rem;">No file chosen</div>
            </div>
        </div>

        <hr style="border-top: 1px solid var(--border); margin: 20px 0;">

        <div class="form-group">
            <label>Employee ID (Roll Number)</label>
            <input type="text" value="{{ user_info[1] }}" disabled style="background:#f1f5f9; cursor:not-allowed;">
        </div>
        
        <div class="form-group">
            <label>Department</label>
            <input type="text" value="{{ user_info[2] }}" disabled style="background:#f1f5f9; cursor:not-allowed;">
        </div>
        
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" value="{{ user_info[0] }}" required>
        </div>
        
        <button type="submit" class="btn btn-primary w-100 mt-20" style="padding: 12px;"><i class="bi bi-check-circle"></i> Save Profile</button>
    </form>
</div>
{% endblock %}
